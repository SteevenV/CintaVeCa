<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cinta Familiar</title>
  <style>
    :root{
      --bg:#0e1116; --card:#1a1f27; --card2:#222835;
      --text:#f2f5f9; --muted:#9aa6b4; --accent:#39d98a;
      --accent2:#4aa3ff; --danger:#ff5d5d; --border:#2b323d;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      min-height:100dvh; padding:16px; padding-bottom:40px;
    }
    .wrap{max-width:560px;margin:0 auto}
    h1{font-size:20px;margin:4px 0 2px;text-align:center}
    .sub{color:var(--muted);text-align:center;font-size:13px;margin:0 0 16px}

    .status{
      display:flex;align-items:center;gap:10px;justify-content:center;
      background:var(--card);border:1px solid var(--border);border-radius:14px;
      padding:12px;margin-bottom:14px;font-size:15px;
    }
    .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:0 0 auto}
    .dot.on{background:var(--accent)}
    .dot.err{background:var(--danger)}

    button{
      font:inherit;font-size:17px;font-weight:600;color:#06110b;
      background:var(--accent);border:none;border-radius:14px;
      padding:16px 20px;width:100%;cursor:pointer;margin-bottom:14px;
    }
    button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.5;cursor:not-allowed}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .tile{
      background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:center;
    }
    .tile .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    .tile .value{font-size:40px;font-weight:700;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
    .tile .unit{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px}
    .tile.hr{display:none}
    .tile.hr .value{color:var(--danger)}

    .note{color:var(--muted);font-size:12px;text-align:center;margin:16px 0 8px}
    details{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
    summary{cursor:pointer;color:var(--muted);font-size:13px}
    #log{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);
      white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:8px}
    .warn{background:#3a2a12;border:1px solid #6b4a1a;color:#ffd9a0;
      border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px;display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🏃 Cinta Familiar</h1>
    <p class="sub">Fase 1 · Conexión y datos en vivo</p>

    <div id="warn" class="warn"></div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Sin conectar</span>
    </div>

    <button id="connectBtn">Conectar cinta</button>
    <button id="disconnectBtn" class="secondary" style="display:none">Desconectar</button>

    <div class="grid">
      <div class="tile">
        <span class="label">Velocidad</span>
        <div><span class="value" id="speed">0.0</span><span class="unit">km/h</span></div>
      </div>
      <div class="tile">
        <span class="label">Distancia</span>
        <div><span class="value" id="distance">0.00</span><span class="unit">km</span></div>
      </div>
      <div class="tile">
        <span class="label">Tiempo</span>
        <div><span class="value" id="time">0:00</span></div>
      </div>
      <div class="tile">
        <span class="label">Calorías</span>
        <div><span class="value" id="calories">0</span><span class="unit">kcal</span></div>
      </div>
      <div class="tile hr" id="hrTile">
        <span class="label">Pulso</span>
        <div><span class="value" id="hr">--</span><span class="unit">ppm</span></div>
      </div>
    </div>

    <p class="note">Pulsa «Conectar cinta» y elige <b>FS-6C0481</b> en la ventana.</p>

    <details>
      <summary>Registro técnico (para resolver problemas)</summary>
      <div id="log"></div>
    </details>
  </div>

  <script>
    // ---- UUIDs del estándar FTMS (Fitness Machine) ----
    const FTMS_SERVICE   = 0x1826;   // Fitness Machine
    const TREADMILL_DATA = 0x2ACD;   // Datos de la cinta (velocidad, distancia, etc.)

    const $ = id => document.getElementById(id);
    const dot = $('dot'), statusText = $('statusText');
    let device = null, dataChar = null;

    // Reloj y distancia locales (por si la cinta no los envía)
    let startTime = null, localTimer = null;
    let deviceSendsTime = false, deviceSendsDistance = false;
    let localDistanceKm = 0, lastTick = null, lastSpeed = 0;

    function log(msg){
      const el = $('log');
      const t = new Date().toLocaleTimeString();
      el.textContent += `[${t}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(text, state){ // state: '', 'on', 'err'
      statusText.textContent = text;
      dot.className = 'dot' + (state ? ' ' + state : '');
    }

    function fmtTime(sec){
      sec = Math.max(0, Math.floor(sec));
      const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
      const mm = (h>0 ? String(m).padStart(2,'0') : m);
      return (h>0 ? h+':' : '') + mm + ':' + String(s).padStart(2,'0');
    }

    // Comprobar que el navegador soporta Bluetooth web
    if(!navigator.bluetooth){
      const w = $('warn');
      w.style.display = 'block';
      w.innerHTML = 'Este navegador no permite Bluetooth. Usa <b>Chrome</b> en Android/Mac ' +
                    'o el navegador <b>Bluefy</b> en iPhone. (Safari no funciona para esto.)';
      $('connectBtn').disabled = true;
    }

    $('connectBtn').addEventListener('click', connect);
    $('disconnectBtn').addEventListener('click', () => { if(device && device.gatt.connected) device.gatt.disconnect(); });

    async function connect(){
      try{
        setStatus('Buscando cinta…', '');
        log('Pidiendo dispositivo Bluetooth…');
        device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [FTMS_SERVICE] }, { namePrefix: 'FS-' }],
          optionalServices: [FTMS_SERVICE]
        });
        log('Elegido: ' + (device.name || '(sin nombre)'));
        device.addEventListener('gattserverdisconnected', onDisconnected);

        setStatus('Conectando…', '');
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(FTMS_SERVICE);
        dataChar = await service.getCharacteristic(TREADMILL_DATA);
        await dataChar.startNotifications();
        dataChar.addEventListener('characteristicvaluechanged', onData);

        startClock();
        setStatus('Conectado a ' + (device.name || 'la cinta'), 'on');
        $('connectBtn').style.display = 'none';
        $('disconnectBtn').style.display = 'block';
        log('¡Conectado! Escuchando datos de la cinta.');
      }catch(err){
        if(err && err.name === 'NotFoundError'){
          setStatus('Conexión cancelada', '');
          log('Cancelado por el usuario (no se eligió cinta).');
        }else{
          setStatus('Error al conectar', 'err');
          log('ERROR: ' + (err && err.message ? err.message : err));
        }
      }
    }

    function onDisconnected(){
      setStatus('Desconectado', 'err');
      $('connectBtn').style.display = 'block';
      $('disconnectBtn').style.display = 'none';
      stopClock();
      log('La cinta se desconectó.');
    }

    function startClock(){
      startTime = Date.now(); lastTick = Date.now(); localDistanceKm = 0;
      localTimer = setInterval(tick, 500);
    }
    function stopClock(){ if(localTimer){ clearInterval(localTimer); localTimer = null; } }

    function tick(){
      const now = Date.now();
      // distancia local = velocidad * tiempo (solo si la cinta no manda distancia)
      if(!deviceSendsDistance){
        const dtH = (now - lastTick) / 3600000;
        localDistanceKm += lastSpeed * dtH;
        $('distance').textContent = localDistanceKm.toFixed(2);
      }
      if(!deviceSendsTime){
        $('time').textContent = fmtTime((now - startTime)/1000);
      }
      lastTick = now;
    }

    // ---- Interpretar el paquete de datos FTMS (Treadmill Data 0x2ACD) ----
    function onData(e){
      const dv = e.target.value; // DataView
      const flags = dv.getUint16(0, true);
      let i = 2;

      // Velocidad instantánea: presente cuando el bit 0 (More Data) está a 0
      if(!(flags & 0x0001)){
        const kmh = dv.getUint16(i, true) / 100; i += 2;
        lastSpeed = kmh;
        $('speed').textContent = kmh.toFixed(1);
      }
      if(flags & 0x0002){ i += 2; } // Velocidad media
      if(flags & 0x0004){           // Distancia total (uint24, metros)
        const d = dv.getUint8(i) | (dv.getUint8(i+1) << 8) | (dv.getUint8(i+2) << 16); i += 3;
        deviceSendsDistance = true;
        $('distance').textContent = (d/1000).toFixed(2);
      }
      if(flags & 0x0008){ i += 4; } // Inclinación + ángulo de rampa
      if(flags & 0x0010){ i += 4; } // Desnivel ganado
      if(flags & 0x0020){ i += 1; } // Ritmo instantáneo
      if(flags & 0x0040){ i += 1; } // Ritmo medio
      if(flags & 0x0080){           // Energía gastada
        const total = dv.getUint16(i, true); i += 2; // Energía total (kcal)
        i += 2; // Energía por hora
        i += 1; // Energía por minuto
        $('calories').textContent = (total === 0xFFFF) ? '--' : total;
      }
      if(flags & 0x0100){           // Ritmo cardíaco (ppm)
        const hr = dv.getUint8(i); i += 1;
        $('hrTile').style.display = 'flex';
        $('hr').textContent = hr;
      }
      if(flags & 0x0200){ i += 1; } // Equivalente metabólico (MET)
      if(flags & 0x0400){           // Tiempo transcurrido (segundos)
        const s = dv.getUint16(i, true); i += 2;
        deviceSendsTime = true;
        $('time').textContent = fmtTime(s);
      }
      // (Resto de campos no los necesitamos en la Fase 1)
    }
  </script>
</body>
</html>
